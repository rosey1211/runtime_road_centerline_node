road_centerline_node:
  ros__parameters:

    # ── Model files (generated by scripts/export_model.py) ────────────────────
    #model_path:  "/home/rosey1211/code/road_code/v2/runtime_version/road_model.pt"
    #config_path: "/home/rosey1211/code/road_code/v2/runtime_version/road_model_config.yaml"
    model_path:  "/home/rosey1211/code/road_code/v2/runtime_version/west_virginia_road_model.pt"    
    config_path: "/home/rosey1211/code/road_code/v2/runtime_version/west_virginia_road_model_config.yaml"    

    # ── Topics ────────────────────────────────────────────────────────────────
    image_topic:   "/image_raw"
    output_topic:  "road_centerline"          # CenterlineResult message
    visual_topic:  "road_centerline/visual"   # sensor_msgs/Image with overlays

    # ── Inference thresholds ──────────────────────────────────────────────────
    road_threshold:  0.5    # min classifier probability to declare road present
    min_peak_conf:   0.2    # min mean peak confidence across rows
    cluster_thresh:  0.45   # min fraction of row peak for bucket to join cluster
    far_row_curve_thresh: 0.2  # min r0 confidence to draw mid→far Bezier segment
    fork_confirm_frames:  4    # consecutive frames both r1 and r0 must show 2+ peaks before drawing a fork

    # ── Temporal tracking / peak stability ───────────────────────────────────
    # These match the defaults in v2/infer_config.py so both tools behave the same.
    temporal_bias_weight:     0.1   # how much to boost clusters near prev-frame peak
    temporal_proximity_range: 0.1   # proximity window as fraction of image width
    fork_hint_thresh:         0.55  # secondary threshold (fraction of primary) when hinted by far row
    fork_hint_proximity:      0.20  # hint match window as fraction of image width
    road_momentum_decay:      0.6   # per-frame momentum decay when road drops
    road_momentum_thresh:     0.25  # min momentum to hold previous peaks as valid

    # ── Flat-world steering ───────────────────────────────────────────────────
    # Leave flat_world_yaml / intrinsics_yaml empty to disable steering output.
    flat_world_yaml:   ""      # path to flat_world_extrinsic.yaml from calibration tool
    intrinsics_yaml:   ""      # path to camera intrinsics yaml (ROS camera_info format)
    lookahead_distance_m: 3.0  # pure-pursuit lookahead distance along the ground (m)
    forward_speed_mps:    0.0  # desired forward speed published in Twist.linear.x (m/s)
    vehicle_wheelbase_m:  0.3  # distance front-to-rear axle — used for steering angle display (m)

    # ── Visualisation ─────────────────────────────────────────────────────────
    debug_mode:        false   # overlay sigmoid response bars on each scan row
    min_display_height: 480    # upscale small images to at least this height
