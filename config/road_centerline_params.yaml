road_centerline_node:
  ros__parameters:

    # ── Model files (generated by scripts/export_model.py) ────────────────────
    #model_path:  "~/ros2_ws/src/runtime_road_centerline_node/models/road_model.pt"
    #config_path: "~/ros2_ws/src/runtime_road_centerline_node/models/road_model_config.yaml"
    #model_path:  "~/ros2_ws/src/runtime_road_centerline_node/models/west_virginia_road_model.pt"
    #config_path: "~/ros2_ws/src/runtime_road_centerline_node/models/west_virginia_road_model_config.yaml"
    model_path:  "~/ros2_ws/src/runtime_road_centerline_node/models/ruby_hill_road_best.pt"
    config_path: "~/ros2_ws/src/runtime_road_centerline_node/models/ruby_hill_road_best_config.yaml"

    # ── Topics ────────────────────────────────────────────────────────────────
    image_topic:   "/image_raw"
    output_topic:  "road_centerline"          # CenterlineResult message
    visual_topic:  "road_centerline/visual"   # sensor_msgs/Image with overlays

    # ── Inference thresholds ──────────────────────────────────────────────────
    road_threshold:  0.5    # min classifier probability to declare road present
    min_peak_conf:   0.2    # min mean peak confidence across rows
    cluster_thresh:  0.45   # min fraction of row peak for bucket to join cluster
    far_row_curve_thresh: 0.2  # min r0 confidence to draw mid→far Bezier segment
    fork_confirm_frames:  4    # consecutive frames both r1 and r0 must show 2+ peaks before drawing a fork
    very_high_confidence_value: 0.4  # tracked only for now; will gate speed determination later

    # ── Temporal tracking / peak stability ───────────────────────────────────
    # These match the defaults in v2/infer_config.py so both tools behave the same.
    temporal_bias_weight:     0.1   # how much to boost clusters near prev-frame peak
    temporal_proximity_range: 0.1   # proximity window as fraction of image width
    fork_hint_thresh:         0.55  # secondary threshold (fraction of primary) when hinted by far row
    fork_hint_proximity:      0.20  # hint match window as fraction of image width
    road_momentum_decay:      0.6   # per-frame momentum decay when road drops
    road_momentum_thresh:     0.25  # min momentum to hold previous peaks as valid

    # ── Flat-world steering ───────────────────────────────────────────────────
    # Leave flat_world_yaml / intrinsics_yaml empty to disable steering output.
    # e.g. "~/ros2_ws/src/runtime_road_centerline_node/calibrations/flat_world_extrinsic.yaml"
    # e.g. "~/ros2_ws/src/runtime_road_centerline_node/calibrations/camera_intrinsics.yaml"
    flat_world_yaml:   "~/ros2_ws/src/runtime_road_centerline_node/calibrations/flat_world_extrinsic.yaml"      # path to flat_world_extrinsic.yaml from calibration tool
    intrinsics_yaml:   "~/ros2_ws/src/runtime_road_centerline_node/calibrations/dumb_camera_intrinsics.yaml"      # DUMMY calibration for testing only — path to camera intrinsics yaml (ROS camera_info format)
    lookahead_distance_m: 3.0  # pure-pursuit lookahead distance along the ground (m)
    forward_speed_mps:    0.0  # desired forward speed published in Twist.linear.x (m/s)
    vehicle_wheelbase_m:  0.3  # distance front-to-rear axle — used for steering angle display (m)

    # ── Speed determination (ControlMsg.desired_speed) ───────────────────────
    # desired_speed = maximum_speed * adjusted_mean_conf * curvature_bias_factor
    # curvature_bias_factor ramps linearly from 1.0 (straight) down to
    # (1 - maximum_curvature_speed_reduction) at maximum_bias_curvature, then
    # stays capped there for any larger curvature.
    maximum_speed:              2.0   # m/s, upper bound on desired_speed
    maximum_bias_curvature:     0.1   # |curvature| at which the reduction caps out
    maximum_curvature_speed_reduction: 0.5   # fractional speed cut at maximum_bias_curvature (0.5 = 50%)

    # ── Visualisation ─────────────────────────────────────────────────────────
    debug_mode:        false   # overlay sigmoid response bars on each scan row
    min_display_height: 480    # upscale small images to at least this height
